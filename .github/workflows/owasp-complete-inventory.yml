name: owasp-complete-inventory

on:
  workflow_dispatch:
  # Temporary feature-branch PR trigger to collect one diagnostic report before workflow registration on master.
  pull_request:

permissions:
  contents: read

jobs:
  unsuppressed-dependency-inventory:
    name: unsuppressed-dependency-inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compare bundled and unbundled Dependency-Check inventories
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Repository Actions secret NVD_API_KEY must be configured for the OWASP inventory."
            exit 1
          fi

          empty_suppressions="$RUNNER_TEMP/empty-dependency-check-suppressions.xml"
          cat > "$empty_suppressions" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <suppressions xmlns="https://jeremylong.github.io/DependencyCheck/dependency-suppression.1.3.xsd"/>
          XML

          run_inventory() {
            local mode="$1"
            local output_directory="$RUNNER_TEMP/dependency-check-$mode"
            local log="$RUNNER_TEMP/dependency-check-$mode.log"
            mkdir -p "$output_directory"

            set +e
            mvn -B org.owasp:dependency-check-maven:13.0.0:check \
              -Dformat=JSON \
              -Dodc.outputDirectory="$output_directory" \
              -DfailBuildOnCVSS=8 \
              -DfailOnError=true \
              -DfailBuildOnUnusedSuppressionRule=true \
              -Danalyzer.dependencybundling.enabled="$2" \
              -DsuppressionFile="$empty_suppressions" \
              -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
              > "$log" 2>&1
            local scanner_status=$?
            set -e

            local report="$output_directory/dependency-check-report.json"
            if [ ! -s "$report" ]; then
              echo "::error::Dependency-Check ($mode) did not produce a JSON report."
              cat "$log"
              exit 1
            fi
            if grep -Eiq 'Unable to parse suppression xml|SuppressionParseException|Exception occurred initializing|Fatal exception' "$log"; then
              echo "::error::Dependency-Check ($mode) failed to initialize; do not treat this as a vulnerability-only diagnostic result."
              cat "$log"
              exit 1
            fi

            python3 ../.github/scripts/generate-owasp-complete-matrix.py \
              "$report" \
              "$output_directory/ACCOUNT_SURVIVAL_OWASP_COMPLETE_MATRIX.md"
            echo "$scanner_status" > "$output_directory/exit-status.txt"
          }

          run_inventory bundled true
          run_inventory unbundled false
          python3 ../.github/scripts/compare-owasp-bundling-reports.py \
            "$RUNNER_TEMP/dependency-check-bundled/dependency-check-report.json" \
            "$RUNNER_TEMP/dependency-check-unbundled/dependency-check-report.json" \
            "$RUNNER_TEMP/OWASP_BUNDLING_COMPARISON.md"

          # This manual workflow is diagnostic. Preserve either analyzer's
          # real vulnerability failure after both reports are retained.
          bundled_status="$(cat "$RUNNER_TEMP/dependency-check-bundled/exit-status.txt")"
          unbundled_status="$(cat "$RUNNER_TEMP/dependency-check-unbundled/exit-status.txt")"
          if [ "$bundled_status" -ne 0 ] || [ "$unbundled_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload unsuppressed Dependency-Check inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-complete-inventory
          path: |
            ${{ runner.temp }}/dependency-check-bundled/
            ${{ runner.temp }}/dependency-check-unbundled/
            ${{ runner.temp }}/OWASP_BUNDLING_COMPARISON.md
          if-no-files-found: warn
