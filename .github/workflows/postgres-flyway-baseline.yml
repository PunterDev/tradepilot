name: PostgreSQL Flyway Baseline

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/postgres-flyway-baseline.yml"
      - "scripts/ci/validate_surefire_report.py"
      - "scripts/ci/tests/test_validate_surefire_report.py"
  push:
    branches:
      - master
      - main
    paths:
      - "backend/**"
      - ".github/workflows/postgres-flyway-baseline.yml"
      - "scripts/ci/validate_surefire_report.py"
      - "scripts/ci/tests/test_validate_surefire_report.py"
  workflow_dispatch:

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        run: mvn test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-surefire-reports
          path: backend/target/surefire-reports/

  postgres-flyway-baseline:
    name: postgres-flyway-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Docker is available
        run: docker version

      - name: Run PostgreSQL Flyway baseline integration test
        run: mvn -Ppostgres-integration test -Dtest=FlywayPostgresBaselineIntegrationTest

      - name: Require all PostgreSQL Flyway tests executed without skips
        run: |
          python3 -m unittest discover -s ../scripts/ci/tests -p 'test_validate_surefire_report.py'
          python3 ../scripts/ci/validate_surefire_report.py \
            --report target/surefire-reports/TEST-com.tradepilot.FlywayPostgresBaselineIntegrationTest.xml \
            --expected-suite com.tradepilot.FlywayPostgresBaselineIntegrationTest \
            --expected-class com.tradepilot.FlywayPostgresBaselineIntegrationTest \
            --required-test emptyPostgresDatabaseMigratesAndValidatesProductionBaseline \
            --required-test existingV030DatabaseUpgradesToV031WithoutChangingDurableEvaluationData \
            --required-test v031RejectsAmbiguousDuplicateCurrentHistoryAndRollsBackEverySchemaChange

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-flyway-baseline-surefire-reports
          path: backend/target/surefire-reports/
