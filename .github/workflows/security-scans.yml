name: security-scans

on:
  pull_request:
  push:
    branches:
      - master

# A new commit to a pull request supersedes older scans for that same pull
# request. Protected-branch pushes use their own group and are never mixed
# with pull-request runs.
concurrency:
  group: security-scans-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Backend dependency check
        working-directory: backend
        # This intentionally fails closed until the separately reviewed trusted
        # NVD-data route is available. Never add NVD credentials to this
        # pull-request-controlled job.
        run: >-
          mvn -B org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=8
          -DfailOnError=true

  frontend-audit:
    name: frontend-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  sast:
    name: sast
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config p/java --config p/typescript --config p/javascript --error --metrics=off
