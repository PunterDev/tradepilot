name: security-scans

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Backend dependency check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Repository Actions secret NVD_API_KEY must be configured for OWASP Dependency-Check."
            exit 1
          fi
          mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8 -DfailBuildOnUnusedSuppressionRule=true -Danalyzer.dependencybundling.enabled=false -DsuppressionFile=config/dependency-check-suppressions.xml -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn

  dependency-negative-control:
    name: dependency-negative-control
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Prove unrelated severe vulnerability remains blocking
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash .github/scripts/verify-owasp-negative-control.sh

  frontend-dependency-audit:
    name: frontend-dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  sast:
    name: sast
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config p/java --config p/typescript --config p/javascript --error --metrics=off
