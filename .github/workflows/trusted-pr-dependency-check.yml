name: trusted-pr-dependency-check

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open pull request number to scan
        required: true
        type: string
      pull_request_head:
        description: Exact current 40-character pull request head SHA to scan
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: read
  pull-requests: read

jobs:
  acquire-verified-nvd:
    if: github.repository == 'PunterDev/tradepilot' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pull_request: ${{ steps.pr.outputs.pull_request }}
      publisher_sha: ${{ steps.publisher.outputs.publisher_sha }}
      publisher_run_id: ${{ steps.publisher.outputs.publisher_run_id }}
      verifier_sha256: ${{ steps.verifier.outputs.sha256 }}
      suppression_required: ${{ steps.pr.outputs.suppression_required }}
      suppression_mode: ${{ steps.suppression.outputs.mode }}
      suppression_verifier_sha256: ${{ steps.suppression.outputs.verifier_sha256 }}
      suppression_sha256: ${{ steps.suppression.outputs.sha256 }}
    steps:
      - name: Check out protected verifier source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm protected workflow source
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = PunterDev/tradepilot
          test "$GITHUB_REF" = refs/heads/master
          [[ "$GITHUB_SHA" =~ ^([0123456789abcdef]){40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Bind the protected verifier source
        id: verifier
        run: |
          set -Eeuo pipefail
          test -f scripts/security/trusted_nvd_archive.py
          cp scripts/security/trusted_nvd_archive.py "$RUNNER_TEMP/trusted-nvd-archive-verifier.py"
          chmod 600 "$RUNNER_TEMP/trusted-nvd-archive-verifier.py"
          sha256sum "$RUNNER_TEMP/trusted-nvd-archive-verifier.py" | awk '{print $1}' | tee "$RUNNER_TEMP/trusted-nvd-verifier.sha256"
          printf 'sha256=%s\n' "$(cat "$RUNNER_TEMP/trusted-nvd-verifier.sha256")" >> "$GITHUB_OUTPUT"
          test -f scripts/security/validate_original_eight_dec15_activation.py
          cp scripts/security/validate_original_eight_dec15_activation.py "$RUNNER_TEMP/validate_original_eight_dec15_activation.py"
          chmod 600 "$RUNNER_TEMP/validate_original_eight_dec15_activation.py"
          test -f scripts/security/validate_second_eight_dec15_activation.py
          cp scripts/security/validate_second_eight_dec15_activation.py "$RUNNER_TEMP/validate_second_eight_dec15_activation.py"
          chmod 600 "$RUNNER_TEMP/validate_second_eight_dec15_activation.py"

      - name: Install patched GitHub CLI for attestation verification
        env:
          GH_VERSION: 2.103.3
          GH_ARCHIVE_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
        run: |
          set -Eeuo pipefail
          test "$(dpkg --print-architecture)" = amd64
          archive="$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GH_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" "$RUNNER_TEMP/gh"
          "$RUNNER_TEMP/gh" --version | grep -F "gh version $GH_VERSION "
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Resolve an open master-targeting pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.pull_request || github.event.pull_request.number }}
          REQUESTED_HEAD: ${{ inputs.pull_request_head || github.event.pull_request.head.sha }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -Eeuo pipefail
          case "$REQUESTED_PR" in (''|*[!0-9]*) exit 1;; esac
          [[ "$REQUESTED_HEAD" =~ ^([0123456789abcdef]){40}$ ]]
          if test -n "$EVENT_PR"; then
            test "$REQUESTED_PR" = "$EVENT_PR"
            test "$REQUESTED_HEAD" = "$EVENT_HEAD"
          fi
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED_PR")"
          if test -n "$EVENT_HEAD"; then
            printf %s "$pr" | python3 scripts/security/trusted_nvd_archive.py validate-pr \
              --metadata - --repository "$GITHUB_REPOSITORY" --expected-number "$REQUESTED_PR" \
              --expected-head "$REQUESTED_HEAD" --event-head "$EVENT_HEAD"
          else
            printf %s "$pr" | python3 scripts/security/trusted_nvd_archive.py validate-pr \
              --metadata - --repository "$GITHUB_REPOSITORY" --expected-number "$REQUESTED_PR" \
              --expected-head "$REQUESTED_HEAD"
          fi
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          {
            printf 'head_sha=%s\n' "$head_sha"
            printf 'pull_request=%s\n' "$REQUESTED_PR"
            if test "$REQUESTED_PR" = 16; then
              printf 'suppression_required=true\n'
            else
              printf 'suppression_required=false\n'
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Acquire and validate the exact owner-approved suppression packages
        if: steps.pr.outputs.suppression_required == 'true'
        id: suppression
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ steps.pr.outputs.pull_request }}
          PULL_REQUEST_HEAD: ${{ steps.pr.outputs.head_sha }}
          ORIGINAL_REVIEWED_COMMIT: 45931748c1551a3bf77d6070f9f37e9fae0c344d
          ORIGINAL_ACTIVATION_COMMIT: 33706d9db11b120df8c20071617b7857704e35ee
          ORIGINAL_CANDIDATE_PATH: docs/security/candidates/dependency-check-original-eight-dec15-candidate.xml
          ORIGINAL_APPROVAL_PATH: docs/security/candidates/owasp-original-eight-dec15-approval.json
          SECOND_CANDIDATE_PATH: docs/security/candidates/dependency-check-second-eight-transitive-dec15-candidate.xml
          SECOND_APPROVAL_PATH: docs/security/candidates/owasp-second-eight-transitive-dec15-approval.json
        run: |
          set -Eeuo pipefail
          umask 077
          staging="$RUNNER_TEMP/pr16-suppression-untrusted"
          handoff="$RUNNER_TEMP/pr16-suppression-validated"
          test ! -e "$staging" && test ! -e "$handoff"
          mkdir -m 700 "$staging"
          if test "$PULL_REQUEST_HEAD" = "$ORIGINAL_ACTIVATION_COMMIT"; then
            gh api "repos/$GITHUB_REPOSITORY/contents/$ORIGINAL_CANDIDATE_PATH?ref=$PULL_REQUEST_HEAD" --jq .content | base64 --decode > "$staging/original-candidate.xml"
            gh api "repos/$GITHUB_REPOSITORY/contents/$ORIGINAL_APPROVAL_PATH?ref=$PULL_REQUEST_HEAD" --jq .content | base64 --decode > "$staging/original-approval.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/6938531951" > "$staging/original-comment.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" > "$staging/pull-request.json"
            gh api "repos/$GITHUB_REPOSITORY/compare/$ORIGINAL_REVIEWED_COMMIT...$PULL_REQUEST_HEAD" > "$staging/original-comparison.json"
            python3 "$RUNNER_TEMP/validate_original_eight_dec15_activation.py" validate \
              --candidate "$staging/original-candidate.xml" --approval "$staging/original-approval.json" \
              --comment "$staging/original-comment.json" --pull-request "$staging/pull-request.json" \
              --comparison "$staging/original-comparison.json" --expected-head "$PULL_REQUEST_HEAD" \
              --handoff-dir "$handoff"
            candidate="$handoff/original-eight-dec15.xml"
            verifier="$RUNNER_TEMP/validate_original_eight_dec15_activation.py"
            mode=original
          else
            gh api "repos/$GITHUB_REPOSITORY/contents/$ORIGINAL_CANDIDATE_PATH?ref=$ORIGINAL_ACTIVATION_COMMIT" --jq .content | base64 --decode > "$staging/original-candidate.xml"
            gh api "repos/$GITHUB_REPOSITORY/contents/$ORIGINAL_APPROVAL_PATH?ref=$ORIGINAL_ACTIVATION_COMMIT" --jq .content | base64 --decode > "$staging/original-approval.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/6938531951" > "$staging/original-comment.json"
            gh api "repos/$GITHUB_REPOSITORY/compare/$ORIGINAL_REVIEWED_COMMIT...$ORIGINAL_ACTIVATION_COMMIT" > "$staging/original-comparison.json"
            gh api "repos/$GITHUB_REPOSITORY/contents/$SECOND_CANDIDATE_PATH?ref=$PULL_REQUEST_HEAD" --jq .content | base64 --decode > "$staging/second-candidate.xml"
            gh api "repos/$GITHUB_REPOSITORY/contents/$SECOND_APPROVAL_PATH?ref=$PULL_REQUEST_HEAD" --jq .content | base64 --decode > "$staging/second-approval.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/7031996454" > "$staging/second-comment.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" > "$staging/pull-request.json"
            gh api "repos/$GITHUB_REPOSITORY/compare/$ORIGINAL_ACTIVATION_COMMIT...$PULL_REQUEST_HEAD" > "$staging/second-comparison.json"
            python3 "$RUNNER_TEMP/validate_second_eight_dec15_activation.py" validate \
              --original-candidate "$staging/original-candidate.xml" --original-approval "$staging/original-approval.json" \
              --original-comment "$staging/original-comment.json" --stage-a-comparison "$staging/original-comparison.json" \
              --second-candidate "$staging/second-candidate.xml" --second-approval "$staging/second-approval.json" \
              --second-comment "$staging/second-comment.json" --pull-request "$staging/pull-request.json" \
              --stage-b-comparison "$staging/second-comparison.json" --expected-head "$PULL_REQUEST_HEAD" \
              --handoff-dir "$handoff"
            candidate="$handoff/second-eight-transitive-dec15.xml"
            verifier="$RUNNER_TEMP/validate_second_eight_dec15_activation.py"
            mode=second
          fi
          {
            printf 'mode=%s\n' "$mode"
            printf 'verifier_sha256=%s\n' "$(sha256sum "$verifier" | awk '{print $1}')"
            printf 'sha256=%s\n' "$(sha256sum "$candidate" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify trusted NVD package
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW: .github/workflows/publish-verified-nvd.yml
          TRUSTED_SIGNER_WORKFLOW: PunterDev/tradepilot/.github/workflows/publish-verified-nvd.yml
          PUBLISHER_WORKFLOW_FILE: publish-verified-nvd.yml
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/publisher"
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLISHER_WORKFLOW_FILE" --jq .id)"
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?branch=master&status=completed" --jq '[.workflow_runs[] | select(.conclusion == "success" and (.event == "schedule" or .event == "workflow_dispatch"))][0].id')"
          test "$run_id" != null
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          test "$(jq -r .repository.full_name <<<"$run")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .workflow_id <<<"$run")" = "$workflow_id"
          test "$(jq -r .status <<<"$run")" = completed
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_branch <<<"$run")" = master
          publisher_sha="$(jq -r .head_sha <<<"$run")"
          [[ "$publisher_sha" =~ ^([0123456789abcdef]){40}$ ]]
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("dependency-check-nvd-")))][0]')"
          test "$artifact" != null
          expected_digest="$(jq -r .digest <<<"$artifact")"
          artifact_id="$(jq -r .id <<<"$artifact")"
          test "$(jq -r .workflow_run.id <<<"$artifact")" = "$run_id"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          [[ "$expected_digest" =~ ^sha256:([0123456789abcdef]){64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/publisher/package.zip"
          test "sha256:$(sha256sum "$RUNNER_TEMP/publisher/package.zip" | awk '{print $1}')" = "$expected_digest"
          python3 scripts/security/trusted_nvd_archive.py extract-publisher-package \
            --archive "$RUNNER_TEMP/publisher/package.zip" --destination "$RUNNER_TEMP/publisher/extracted"
          mv "$RUNNER_TEMP/publisher/extracted/"* "$RUNNER_TEMP/publisher/"
          gh attestation verify "$RUNNER_TEMP/publisher/dependency-check-nvd.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$TRUSTED_SIGNER_WORKFLOW" \
            --source-ref refs/heads/master --source-digest "$publisher_sha" --deny-self-hosted-runners
          python3 scripts/security/trusted_nvd_archive.py verify \
            --archive "$RUNNER_TEMP/publisher/dependency-check-nvd.tar.gz" \
            --manifest "$RUNNER_TEMP/publisher/dependency-check-nvd.manifest.json" \
            --destination "$RUNNER_TEMP/verified-nvd-input" \
            --repository "$GITHUB_REPOSITORY" --publisher-workflow "$TRUSTED_WORKFLOW" --max-age-hours 24 \
            --expected-source-revision "$publisher_sha" --expected-workflow-run-id "$run_id"
          printf 'publisher_sha=%s\n' "$publisher_sha" >> "$GITHUB_OUTPUT"
          printf 'publisher_run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Pass verified package to the credential-free scanner
        run: |
          set -Eeuo pipefail
          mkdir "$RUNNER_TEMP/scan-input"
          cp "$RUNNER_TEMP/publisher/dependency-check-nvd.tar.gz" "$RUNNER_TEMP/publisher/dependency-check-nvd.manifest.json" \
            "$RUNNER_TEMP/trusted-nvd-verifier.sha256" "$RUNNER_TEMP/trusted-nvd-archive-verifier.py" "$RUNNER_TEMP/scan-input/"
          chmod 600 "$RUNNER_TEMP/scan-input/"*

      - name: Prepare validated suppression for the credential-free scanner
        if: steps.pr.outputs.suppression_required == 'true'
        run: |
          set -Eeuo pipefail
          mkdir "$RUNNER_TEMP/suppression-input"
          cp "$RUNNER_TEMP/validate_original_eight_dec15_activation.py" "$RUNNER_TEMP/suppression-input/"
          cp "$RUNNER_TEMP/validate_second_eight_dec15_activation.py" "$RUNNER_TEMP/suppression-input/"
          cp -R "$RUNNER_TEMP/pr16-suppression-validated" "$RUNNER_TEMP/suppression-input/validated"
          chmod 600 "$RUNNER_TEMP/suppression-input/validate_original_eight_dec15_activation.py" "$RUNNER_TEMP/suppression-input/validate_second_eight_dec15_activation.py" "$RUNNER_TEMP/suppression-input/validated/"*

      - name: Upload verified package for the credential-free scanner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-nvd-input
          path: ${{ runner.temp }}/scan-input
          if-no-files-found: error
          retention-days: 1

      - name: Upload validated suppression for the credential-free scanner
        if: steps.pr.outputs.suppression_required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-pr16-suppression
          path: ${{ runner.temp }}/suppression-input
          if-no-files-found: error
          retention-days: 1

  dependency-scan:
    needs: acquire-verified-nvd
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Download verified NVD input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-nvd-input
          path: ${{ runner.temp }}/publisher

      - name: Download validated suppression input
        if: needs.acquire-verified-nvd.outputs.suppression_required == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-pr16-suppression
          path: ${{ runner.temp }}/suppression

      - name: Reverify the NVD input before PR checkout
        run: |
          set -Eeuo pipefail
          test "$(sha256sum "$RUNNER_TEMP/publisher/trusted-nvd-archive-verifier.py" | awk '{print $1}')" = "${{ needs.acquire-verified-nvd.outputs.verifier_sha256 }}"
          python3 "$RUNNER_TEMP/publisher/trusted-nvd-archive-verifier.py" verify \
            --archive "$RUNNER_TEMP/publisher/dependency-check-nvd.tar.gz" \
            --manifest "$RUNNER_TEMP/publisher/dependency-check-nvd.manifest.json" \
            --destination "$RUNNER_TEMP/verified-nvd-input" \
            --repository "$GITHUB_REPOSITORY" \
            --publisher-workflow .github/workflows/publish-verified-nvd.yml --max-age-hours 24 \
            --expected-source-revision "${{ needs.acquire-verified-nvd.outputs.publisher_sha }}" \
            --expected-workflow-run-id "${{ needs.acquire-verified-nvd.outputs.publisher_run_id }}"

      - name: Revalidate the exact PR head before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ needs.acquire-verified-nvd.outputs.pull_request }}
          EXPECTED_HEAD: ${{ needs.acquire-verified-nvd.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST")"
          printf %s "$pr" | python3 "$RUNNER_TEMP/publisher/trusted-nvd-archive-verifier.py" validate-pr \
            --metadata - --repository "$GITHUB_REPOSITORY" --expected-number "$PULL_REQUEST" \
            --expected-head "$EXPECTED_HEAD"

      - name: Reverify the validated suppression before PR checkout
        if: needs.acquire-verified-nvd.outputs.suppression_required == 'true'
        run: |
          set -Eeuo pipefail
          case "${{ needs.acquire-verified-nvd.outputs.suppression_mode }}" in
            original)
              verifier="$RUNNER_TEMP/suppression/validate_original_eight_dec15_activation.py"
              candidate="$RUNNER_TEMP/suppression/validated/original-eight-dec15.xml"
              ;;
            second)
              verifier="$RUNNER_TEMP/suppression/validate_second_eight_dec15_activation.py"
              candidate="$RUNNER_TEMP/suppression/validated/second-eight-transitive-dec15.xml"
              ;;
            *) exit 1;;
          esac
          test "$(sha256sum "$verifier" | awk '{print $1}')" = "${{ needs.acquire-verified-nvd.outputs.suppression_verifier_sha256 }}"
          python3 "$verifier" verify-handoff --handoff-dir "$RUNNER_TEMP/suppression/validated" \
            --expected-head "${{ needs.acquire-verified-nvd.outputs.head_sha }}"
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "${{ needs.acquire-verified-nvd.outputs.suppression_sha256 }}"
          printf 'VALIDATED_SUPPRESSION_FILE=%s\n' "$candidate" >> "$GITHUB_ENV"

      - name: Check out exact pull request source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.acquire-verified-nvd.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Run credential-free Dependency-Check
        id: scan
        working-directory: backend
        env:
          NVD_API_KEY: ''
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          DEPENDENCY_CHECK_DATA: ${{ runner.temp }}/verified-nvd-input/data
        run: |
          set +e
          suppression_argument=()
          if test "${{ needs.acquire-verified-nvd.outputs.suppression_required }}" = true; then
            test -n "$VALIDATED_SUPPRESSION_FILE"
            suppression_argument+=("-DsuppressionFile=$VALIDATED_SUPPRESSION_FILE")
          fi
          mvn -B org.owasp:dependency-check-maven:12.2.2:check \
            -DautoUpdate=false -DdataDirectory="$DEPENDENCY_CHECK_DATA" \
            "${suppression_argument[@]}" \
            -Dformats=HTML,JSON,SARIF -Dodc.outputDirectory="$RUNNER_TEMP/dependency-check-report" \
            -DfailOnError=true -DfailBuildOnCVSS=8 -DfailBuildOnUnusedSuppressionRule=true
          status=$?
          set -e
          test -s "$RUNNER_TEMP/dependency-check-report/dependency-check-report.json"
          test -s "$RUNNER_TEMP/dependency-check-report/dependency-check-report.html"
          test -s "$RUNNER_TEMP/dependency-check-report/dependency-check-report.sarif"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-dependency-check-report
          path: ${{ runner.temp }}/dependency-check-report
          if-no-files-found: error
          retention-days: 14

      - name: Require a successful real scan result
        if: always()
        run: test "${{ steps.scan.outputs.status }}" = "0"

  publish-commit-specific-check:
    if: always() && needs.acquire-verified-nvd.result == 'success'
    needs: [acquire-verified-nvd, dependency-scan]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Publish only a current exact-head result
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ needs.acquire-verified-nvd.outputs.pull_request }}
          SCANNED_HEAD: ${{ needs.acquire-verified-nvd.outputs.head_sha }}
          SCAN_RESULT: ${{ needs.dependency-scan.result }}
        run: |
          set -Eeuo pipefail
          [[ "$SCANNED_HEAD" =~ ^([0123456789abcdef]){40}$ ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST")"
          current_head="$(jq -r .head.sha <<<"$pr")"
          current="$(test "$(jq -r .state <<<"$pr")" = open && test "$(jq -r .base.ref <<<"$pr")" = master && test "$(jq -r .base.repo.full_name <<<"$pr")" = "$GITHUB_REPOSITORY" && test "$(jq -r .head.repo.full_name <<<"$pr")" = "$GITHUB_REPOSITORY" && test "$current_head" = "$SCANNED_HEAD" && echo true || echo false)"
          conclusion=failure
          if test "$current" = true && test "$SCAN_RESULT" = success; then
            conclusion=success
          elif test "$current" != true; then
            conclusion=cancelled
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=trusted-dependency-check -f head_sha="$SCANNED_HEAD" -f status=completed \
            -f conclusion="$conclusion" -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f 'output[title]=Trusted Dependency-Check' -f "output[summary]=Credential-free scan result: $conclusion" >/dev/null
          test "$conclusion" = success
