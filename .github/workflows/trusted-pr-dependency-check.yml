name: trusted-pr-dependency-check

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open pull request number to scan
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: read
  pull-requests: read

jobs:
  acquire-verified-nvd:
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Check out protected verifier source
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Resolve an open master-targeting pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.pull_request || github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          case "$REQUESTED_PR" in (''|*[!0-9]*) exit 1;; esac
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED_PR")"
          test "$(jq -r '.state' <<<"$pr")" = open
          test "$(jq -r '.base.ref' <<<"$pr")" = master
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Download and verify trusted NVD package
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW: .github/workflows/publish-verified-nvd.yml
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/publisher" "$RUNNER_TEMP/verified-nvd-input"
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$TRUSTED_WORKFLOW" --jq .id)"
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?branch=master&status=completed" --jq '[.workflow_runs[] | select(.conclusion == "success" and (.event == "schedule" or .event == "workflow_dispatch"))[0].id')"
          test "$run_id" != null
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          test "$(jq -r .head_branch <<<"$run")" = master
          publisher_sha="$(jq -r .head_sha <<<"$run")"
          [[ "$publisher_sha" =~ ^[0-9a-f]{40}$ ]]
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("dependency-check-nvd-"))][0]')"
          test "$artifact" != null
          expected_digest="$(jq -r .digest <<<"$artifact")"
          artifact_id="$(jq -r .id <<<"$artifact")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/publisher/package.zip"
          test "sha256:$(sha256sum "$RUNNER_TEMP/publisher/package.zip" | awk '{print $1}')" = "$expected_digest"
          python3 - "$RUNNER_TEMP/publisher/package.zip" "$RUNNER_TEMP/publisher" <<'PY'
          import pathlib, sys, zipfile
          archive, destination = map(pathlib.Path, sys.argv[1:])
          expected = {"dependency-check-nvd.tar.gz", "dependency-check-nvd.manifest.json"}
          with zipfile.ZipFile(archive) as package:
              names = set(package.namelist())
              if names != expected or any(pathlib.PurePosixPath(name).is_absolute() or ".." in pathlib.PurePosixPath(name).parts for name in names):
                  raise SystemExit("unsafe publisher artifact")
              package.extractall(destination)
          PY
          gh attestation verify "$RUNNER_TEMP/publisher/dependency-check-nvd.tar.gz" --repo "$GITHUB_REPOSITORY" --signer-workflow "$TRUSTED_WORKFLOW"
          python3 scripts/security/trusted_nvd_archive.py verify \
            --archive "$RUNNER_TEMP/publisher/dependency-check-nvd.tar.gz" \
            --manifest "$RUNNER_TEMP/publisher/dependency-check-nvd.manifest.json" \
            --destination "$RUNNER_TEMP/verified-nvd-input" \
            --repository "$GITHUB_REPOSITORY" --publisher-workflow "$TRUSTED_WORKFLOW" --max-age-hours 24 \
            --expected-source-revision "$publisher_sha" --expected-workflow-run-id "$run_id"

      - name: Pass verified package to the credential-free scanner
        uses: actions/upload-artifact@v4
        with:
          name: verified-nvd-input
          path: |
            ${{ runner.temp }}/publisher/dependency-check-nvd.tar.gz
            ${{ runner.temp }}/publisher/dependency-check-nvd.manifest.json
          if-no-files-found: error
          retention-days: 1

  dependency-scan:
    needs: acquire-verified-nvd
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download verified NVD input
        uses: actions/download-artifact@v4
        with:
          name: verified-nvd-input
          path: ${{ runner.temp }}/publisher

      - name: Reverify the NVD input before PR checkout
        run: |
          set -Eeuo pipefail
          python3 scripts/security/trusted_nvd_archive.py verify \
            --archive "$RUNNER_TEMP/publisher/dependency-check-nvd.tar.gz" \
            --manifest "$RUNNER_TEMP/publisher/dependency-check-nvd.manifest.json" \
            --destination "$RUNNER_TEMP/verified-nvd-input" \
            --repository "$GITHUB_REPOSITORY" \
            --publisher-workflow .github/workflows/publish-verified-nvd.yml --max-age-hours 24

      - name: Check out exact pull request source without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.acquire-verified-nvd.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run credential-free Dependency-Check
        id: scan
        working-directory: backend
        env:
          NVD_API_KEY: ''
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          DEPENDENCY_CHECK_DATA: ${{ runner.temp }}/verified-nvd-input/data
        run: |
          set +e
          mvn -B org.owasp:dependency-check-maven:12.2.2:check \
            -DautoUpdate=false -DdataDirectory="$DEPENDENCY_CHECK_DATA" \
            -Dformats=HTML,JSON,SARIF -DoutputDirectory="$RUNNER_TEMP/dependency-check-report" \
            -DfailOnError=true -DfailBuildOnCVSS=8 -DfailBuildOnUnusedSuppressionRule=true
          status=$?
          set -e
          test -s "$RUNNER_TEMP/dependency-check-report/dependency-check-report.json"
          test -s "$RUNNER_TEMP/dependency-check-report/dependency-check-report.html"
          test -s "$RUNNER_TEMP/dependency-check-report/dependency-check-report.sarif"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-dependency-check-report
          path: ${{ runner.temp }}/dependency-check-report
          if-no-files-found: error
          retention-days: 14

      - name: Preserve the real scan result
        if: always()
        run: exit "${{ steps.scan.outputs.status || 1 }}"
