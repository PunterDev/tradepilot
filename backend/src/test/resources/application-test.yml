spring:
  datasource:
    url: jdbc:h2:mem:tradepilot-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
tradepilot:
  features:
    v2-enabled: true
    v3-enabled: true
  market-data:
    provider: disabled
app:
  frontend-url: http://localhost:5173
  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    expiration-minutes: 30
    expiration-ms: 1800000
  admin-bootstrap:
    enabled: false
  rate-limit:
    auth-login:
      max-requests: 1000
    auth-register:
      max-requests: 1000
    auth-email:
      max-requests: 1000
    contact:
      max-requests: 1000
    ai-generation:
      max-requests: 1000
