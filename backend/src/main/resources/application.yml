spring:
  datasource:
    url: ${DB_URL:${DATABASE_URL}}
    username: ${DB_USERNAME:${DATABASE_USERNAME}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD}}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${SERVER_PORT:8080}

tradepilot:
  features:
    v2-enabled: ${V2_FEATURES_ENABLED:false}
    v3-enabled: ${V3_FEATURES_ENABLED:false}
  market-data:
    provider: ${MARKET_DATA_PROVIDER:disabled}

    databento:
      api-key: ${DATABENTO_API_KEY:}
      dataset: ${DATABENTO_DATASET:GLBX.MDP3}
      schema: ${DATABENTO_SCHEMA:ohlcv-1m}

      # Safety protection for historical data usage
      cost-check-enabled: ${DATABENTO_COST_CHECK_ENABLED:true}
      max-request-cost-usd: ${DATABENTO_MAX_REQUEST_COST_USD:0.05}

    replay-delay-hours: ${REPLAY_DELAY_HOURS:24}

    pre-trade-minutes: ${REPLAY_PRE_TRADE_MINUTES:15}
    post-trade-minutes: ${REPLAY_POST_TRADE_MINUTES:30}
    max-window-hours: ${REPLAY_MAX_WINDOW_HOURS:2}

    # Default this to false so local development cannot accidentally
    # generate replay data continuously in the background.
    worker-enabled: ${REPLAY_WORKER_ENABLED:false}

    worker-initial-delay-ms: ${REPLAY_WORKER_INITIAL_DELAY_MS:60000}
    worker-fixed-delay-ms: ${REPLAY_WORKER_FIXED_DELAY_MS:300000}
    cache-enabled: ${REPLAY_CACHE_ENABLED:true}
  trading-memory:
    enabled: ${TRADING_MEMORY_ENABLED:true}
    collection-name: ${QDRANT_COLLECTION_NAME:tradepilot_trade_memories}
    vector-size: ${TRADING_MEMORY_VECTOR_SIZE:1536}
    similarity-threshold: ${TRADING_MEMORY_SIMILARITY_THRESHOLD:0.72}
    default-limit: ${TRADING_MEMORY_DEFAULT_LIMIT:5}
    max-limit: ${TRADING_MEMORY_MAX_LIMIT:10}
    min-pattern-sample: ${TRADING_MEMORY_MIN_PATTERN_SAMPLE:5}
    min-pattern-occurrences: ${TRADING_MEMORY_MIN_PATTERN_OCCURRENCES:3}
    request-timeout-ms: ${TRADING_MEMORY_REQUEST_TIMEOUT_MS:3000}
    embedding-model: ${TRADING_MEMORY_EMBEDDING_MODEL:text-embedding-3-small}
    qdrant-url: ${QDRANT_URL:}
    qdrant-api-key: ${QDRANT_API_KEY:}
    qdrant-auto-create-collection: ${TRADING_MEMORY_QDRANT_AUTO_CREATE_COLLECTION:true}
    qdrant-validate-on-startup: ${TRADING_MEMORY_QDRANT_VALIDATE_ON_STARTUP:true}
    qdrant-expected-distance: ${TRADING_MEMORY_QDRANT_EXPECTED_DISTANCE:COSINE}
    qdrant-create-payload-indexes: ${TRADING_MEMORY_QDRANT_CREATE_PAYLOAD_INDEXES:true}
    retry-enabled: ${TRADING_MEMORY_RETRY_ENABLED:false}
    retry-max-attempts: ${TRADING_MEMORY_RETRY_MAX_ATTEMPTS:5}
    retry-initial-delay-seconds: ${TRADING_MEMORY_RETRY_INITIAL_DELAY_SECONDS:60}
    retry-max-delay-seconds: ${TRADING_MEMORY_RETRY_MAX_DELAY_SECONDS:3600}
    retry-batch-size: ${TRADING_MEMORY_RETRY_BATCH_SIZE:50}

app:
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  dev-auth:
    enabled: ${DEV_AUTH_ENABLED:false}
  dev-tools-enabled: ${DEV_TOOLS_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
  http-client:
    connect-timeout: ${APP_HTTP_CLIENT_CONNECT_TIMEOUT:5s}
    read-timeout: ${APP_HTTP_CLIENT_READ_TIMEOUT:30s}
  ai:
    async:
      core-pool-size: ${APP_AI_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${APP_AI_ASYNC_MAX_POOL_SIZE:6}
      queue-capacity: ${APP_AI_ASYNC_QUEUE_CAPACITY:50}
  email:
    resend:
      api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:}
    async:
      core-pool-size: ${APP_EMAIL_ASYNC_CORE_POOL_SIZE:1}
      max-pool-size: ${APP_EMAIL_ASYNC_MAX_POOL_SIZE:3}
      queue-capacity: ${APP_EMAIL_ASYNC_QUEUE_CAPACITY:100}
  frontend-url: ${APP_FRONTEND_URL:${FRONTEND_URL:http://localhost:5173}}
  admin-email: ${APP_ADMIN_EMAIL:}
  admin-bootstrap:
    enabled: ${APP_ADMIN_BOOTSTRAP_ENABLED:false}
  contact-email: ${CONTACT_EMAIL:support@tradepilot.app}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    pro-price-id: ${STRIPE_PRO_MONTHLY_PRICE_ID:${STRIPE_PRO_PRICE_ID:}}
    pro-yearly-price-id: ${STRIPE_PRO_YEARLY_PRICE_ID:}
  observability:
    slow-request-warn-ms: ${SLOW_REQUEST_WARN_MS:1000}
    slow-request-error-ms: ${SLOW_REQUEST_ERROR_MS:5000}
    slow-query-threshold-ms: ${SLOW_QUERY_THRESHOLD_MS:250}
    ai-cost-per-1k-tokens: ${AI_COST_PER_1K_TOKENS:0.0006}
    ai-cost-daily-threshold: ${AI_COST_DAILY_THRESHOLD:10.00}
    cleanup-cron: ${OBSERVABILITY_CLEANUP_CRON:0 20 3 * * *}
    alert-evaluation-interval-ms: ${OBSERVABILITY_ALERT_EVALUATION_INTERVAL_MS:300000}
    retention:
      api-request-metrics-days: ${OBSERVABILITY_RETENTION_API_REQUEST_METRICS_DAYS:60}
      slow-request-events-days: ${OBSERVABILITY_RETENTION_SLOW_REQUEST_EVENTS_DAYS:90}
      ai-request-metrics-days: ${OBSERVABILITY_RETENTION_AI_REQUEST_METRICS_DAYS:90}
      cache-metrics-days: ${OBSERVABILITY_RETENTION_CACHE_METRICS_DAYS:30}
      email-delivery-events-days: ${OBSERVABILITY_RETENTION_EMAIL_DELIVERY_EVENTS_DAYS:90}
      stripe-events-days: ${OBSERVABILITY_RETENTION_STRIPE_EVENTS_DAYS:180}
      query-performance-events-days: ${OBSERVABILITY_RETENTION_QUERY_PERFORMANCE_EVENTS_DAYS:60}
      system-alerts-days: ${OBSERVABILITY_RETENTION_SYSTEM_ALERTS_DAYS:180}
  rate-limit:
    auth-login:
      max-requests: ${RATE_LIMIT_AUTH_LOGIN_MAX:8}
      window-seconds: ${RATE_LIMIT_AUTH_LOGIN_WINDOW_SECONDS:60}
    auth-register:
      max-requests: ${RATE_LIMIT_AUTH_REGISTER_MAX:5}
      window-seconds: ${RATE_LIMIT_AUTH_REGISTER_WINDOW_SECONDS:300}
    auth-email:
      max-requests: ${RATE_LIMIT_AUTH_EMAIL_MAX:5}
      window-seconds: ${RATE_LIMIT_AUTH_EMAIL_WINDOW_SECONDS:300}
    contact:
      max-requests: ${RATE_LIMIT_CONTACT_MAX:3}
      window-seconds: ${RATE_LIMIT_CONTACT_WINDOW_SECONDS:300}
    ai-generation:
      max-requests: ${RATE_LIMIT_AI_GENERATION_MAX:12}
      window-seconds: ${RATE_LIMIT_AI_GENERATION_WINDOW_SECONDS:300}
    csv-import:
      max-requests: ${RATE_LIMIT_CSV_IMPORT_MAX:6}
      window-seconds: ${RATE_LIMIT_CSV_IMPORT_WINDOW_SECONDS:300}
    billing-checkout:
      max-requests: ${RATE_LIMIT_BILLING_CHECKOUT_MAX:10}
      window-seconds: ${RATE_LIMIT_BILLING_CHECKOUT_WINDOW_SECONDS:300}
