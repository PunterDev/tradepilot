spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tradepilot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
  dev-auth:
    enabled: ${DEV_AUTH_ENABLED:true}
  mail:
    from: ${MAIL_FROM:no-reply@tradepilot.ai}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    pro-price-id: ${STRIPE_PRO_MONTHLY_PRICE_ID:${STRIPE_PRO_PRICE_ID:}}
    pro-yearly-price-id: ${STRIPE_PRO_YEARLY_PRICE_ID:}
  admin-email: ${APP_ADMIN_EMAIL:}
  admin-bootstrap:
    enabled: ${APP_ADMIN_BOOTSTRAP_ENABLED:false}
  contact-email: ${CONTACT_EMAIL:support@tradepilot.app}
