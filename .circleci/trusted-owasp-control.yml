# INACTIVE DESIGN ARTIFACT. CircleCI reads .circleci/config.yml, not this file.
# This control pipeline must live on protected master before any context exists.
version: 2.1

parameters:
  security_activation:
    type: boolean
    default: false
  target_pr:
    type: integer
    default: 0
  target_sha:
    type: string
    default: ""
  candidate_sha256:
    type: string
    default: ""

executors:
  java17:
    docker:
      - image: cimg/openjdk:17.0.13@sha256:402f246164077f437f8a19d586137038e83beb63d21bedbc89cd5d11ee20b3e6

jobs:
  trusted-approval-validation:
    executor: java17
    steps:
      - checkout
      - run:
          name: Validate exact PR approval from protected master code
          command: |
            set -Eeuo pipefail
            test "$CIRCLE_BRANCH" = master
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            python3 scripts/circleci/validate_trusted_owasp_activation.py \
              --target-pr << pipeline.parameters.target_pr >> \
              --target-sha << pipeline.parameters.target_sha >> \
              --candidate-sha256 << pipeline.parameters.candidate_sha256 >>
      - persist_to_workspace:
          root: /tmp
          paths: [approved-target.json]

  trusted-nvd-refresh:
    executor: java17
    steps:
      - checkout
      - run:
          name: Refresh NVD data from protected master code
          command: |
            set -Eeuo pipefail
            : "${NVD_API_KEY:?protected context is required}"
            bash scripts/circleci/refresh_trusted_nvd_data.sh /tmp/nvd-bundle
      - persist_to_workspace:
          root: /tmp
          paths: [nvd-bundle]

  secretless-dependency-check:
    executor: java17
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - run:
          name: Verify trusted artifacts and scan exact approved source
          command: |
            set -Eeuo pipefail
            test "$CIRCLE_BRANCH" = master
            env -u NVD_API_KEY -u TRADEPILOT_GITHUB_APPROVAL_READ_TOKEN \
              python3 scripts/circleci/verify_trusted_nvd_manifest.py \
                --manifest /tmp/nvd-bundle/manifest.json \
                --archive /tmp/nvd-bundle/dependency-check-data.tar.gz
            env -u NVD_API_KEY -u TRADEPILOT_GITHUB_APPROVAL_READ_TOKEN \
              bash scripts/circleci/scan_approved_pr_dependency_graph.sh \
                /tmp/approved-target.json /tmp/nvd-bundle
      - persist_to_workspace:
          root: /tmp
          paths: [analysis-result.json, analysis-report.json]

  trusted-final-approval-validation:
    executor: java17
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - run:
          name: Revalidate approval and accept only the exact scan result
          command: |
            set -Eeuo pipefail
            test "$CIRCLE_BRANCH" = master
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            python3 scripts/circleci/validate_trusted_owasp_activation.py \
              --target-pr << pipeline.parameters.target_pr >> \
              --target-sha << pipeline.parameters.target_sha >> \
              --candidate-sha256 << pipeline.parameters.candidate_sha256 >> \
              --output /tmp/revalidated-target.json
            cmp /tmp/approved-target.json /tmp/revalidated-target.json
            python3 scripts/circleci/verify_trusted_nvd_manifest.py \
              --manifest /tmp/nvd-bundle/manifest.json \
              --archive /tmp/nvd-bundle/dependency-check-data.tar.gz \
              --analysis-evidence /tmp/analysis-result.json \
              --approved-target /tmp/approved-target.json \
              --report /tmp/analysis-report.json

workflows:
  trusted-owasp-activation:
    when:
      and:
        - equal: [true, << pipeline.parameters.security_activation >>]
        - equal: [master, << pipeline.git.branch >>]
    jobs:
      - trusted-approval-validation:
          context: tradepilot-approval-read
      - trusted-nvd-refresh:
          context: tradepilot-nvd-refresh
      - secretless-dependency-check:
          requires: [trusted-approval-validation, trusted-nvd-refresh]
      - trusted-final-approval-validation:
          context: tradepilot-approval-read
          requires: [secretless-dependency-check]
